name: Java CI/CD with Docker & EC2

on:
  push:
    branches: [ "main", "develop" ] # 배포 대상 브랜치 (필요시 master 등으로 수정)

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 설정 (프로젝트 자바 버전에 맞게 수정, 예: 17 또는 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 빌드 (테스트 제외 시 -x test 추가)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인 (등록해두신 Secret 사용)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 5. Docker 이미지 빌드 및 Docker Hub 푸시
      # PROJECT_NAME secret도 등록되어 있으니 그대로 활용합니다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.PROJECT_NAME }}:latest

      # 6. docker-compose.yml을 EC2로 전송
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.PORT }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      # 7. EC2에서 docker compose로 배포
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.PORT }}
          envs: DOCKERHUB_USERNAME,PROJECT_NAME,DB_PASSWORD,GEMINI_API_KEY,ANTHROPIC_API_KEY,AWS_ACCESS_KEY,AWS_SECRET_KEY
          script: |
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export PROJECT_NAME=${{ secrets.PROJECT_NAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            export ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            export AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
            export AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}

            cd /home/${{ secrets.EC2_USERNAME }}/app
            docker compose pull app
            docker compose up -d