version: '3.8'

services:
  app:
    image: ${DOCKERHUB_USERNAME}/${PROJECT_NAME}:latest
    container_name: ${PROJECT_NAME}
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://db:5432/nuro
      - DB_USERNAME=nuro_user
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - SOLAPI_API_KEY=${SOLAPI_API_KEY}
      - SOLAPI_API_SECRET=${SOLAPI_API_SECRET}
      - SOLAPI_SENDER=${SOLAPI_SENDER}
      - APP_RESULT_BASE_URL=${APP_RESULT_BASE_URL}
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16
    container_name: nuro-db
    environment:
      - POSTGRES_DB=nuro
      - POSTGRES_USER=nuro_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: